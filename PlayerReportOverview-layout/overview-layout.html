<!doctype html><meta charset="utf-8"><title>PlayerReportOverview tile layout</title><style>body{margin:32px;background:#0c1424;color:#eaf2ff;font:16px 'Microsoft YaHei',sans-serif}h1{font-size:26px}button{padding:9px 16px;margin:0 8px 16px 0;background:#253951;color:white;border:1px solid #57758e;border-radius:7px;cursor:pointer}button.on{background:#256784}#grid{display:grid;width:min(1320px,96vw);gap:6px}.tile{border:1px solid #57758e;border-radius:9px;background:#253951;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;cursor:pointer}.tile:first-child{background:#183c54}.tile small{display:block;color:#afc5df;margin-top:9px}#detail{padding:20px;background:#172538;margin-top:20px;white-space:pre-wrap;border-radius:9px}p{color:#adbfda;line-height:1.7}</style><h1>PlayerReportOverview · 当前文件中的 tile 布局</h1><p>选择布局；点击模块查看原始坐标和尺寸。网格单位不是 px，不能从此图确定游戏当前采用哪一套断点。</p><nav id="tabs"></nav><section id="grid"></section><div id="detail"></div><p>PlayerAttributesBlock 内含：250px 头部横条、260×260px 卡面、头像与信息、右侧能力／潜力上方的操作按钮，以及下方属性内容。原头部位置高度为 0。</p><script>const data={"Standard": [{"id": "PlayerAttributesBlock", "x": 0, "y": 0, "width": 16, "height": 5}, {"id": "Happiness", "x": 0, "y": 5, "width": 2, "height": 2}, {"id": "FItness", "x": 2, "y": 5, "width": 2, "height": 2}, {"id": "PlayerSeasonStats", "x": 8, "y": 5, "width": 4, "height": 2}, {"id": "CareerStats", "x": 12, "y": 5, "width": 4, "height": 2}, {"id": "PlayerForm", "x": 4, "y": 5, "width": 2, "height": 2}, {"id": "PlayerTrainingOverview", "x": 6, "y": 5, "width": 2, "height": 2}], "Large-FMC": [{"id": "PlayerAttributesBlock", "x": 0, "y": 0, "width": 20, "height": 6}, {"id": "FItness", "x": 0, "y": 6, "width": 4, "height": 2}, {"id": "Happiness", "x": 4, "y": 6, "width": 4, "height": 2}, {"id": "PlayerForm", "x": 8, "y": 6, "width": 4, "height": 2}, {"id": "PlayerSeasonStats", "x": 12, "y": 6, "width": 4, "height": 2}, {"id": "CareerStats", "x": 16, "y": 6, "width": 4, "height": 2}], "Small": [{"id": "PlayerAttributesBlock", "x": 0, "y": 0, "width": 12, "height": 5}, {"id": "FItness", "x": 2, "y": 5, "width": 2, "height": 2}, {"id": "PlayerSeasonStats", "x": 6, "y": 5, "width": 4, "height": 2}, {"id": "CareerStats", "x": 10, "y": 5, "width": 2, "height": 2}, {"id": "Happiness", "x": 0, "y": 5, "width": 2, "height": 2}, {"id": "PlayerForm", "x": 4, "y": 5, "width": 2, "height": 2}], "Phone_Landscape": [{"id": "PlayerAttributesBlock", "x": 0, "y": 0, "width": 12, "height": 6}], "Large": [{"id": "PlayerAttributesBlock", "x": 0, "y": 0, "width": 20, "height": 6}, {"id": "Happiness", "x": 0, "y": 6, "width": 2, "height": 2}, {"id": "FItness", "x": 2, "y": 6, "width": 2, "height": 2}, {"id": "PlayerForm", "x": 4, "y": 6, "width": 2, "height": 2}, {"id": "PlayerTrainingOverview", "x": 6, "y": 6, "width": 2, "height": 2}, {"id": "PlayerSeasonStats", "x": 8, "y": 6, "width": 8, "height": 2}, {"id": "CareerStats", "x": 16, "y": 6, "width": 4, "height": 2}]}, labels={"PlayerAttributesBlock": "球员属性主区域", "Happiness": "满意度", "FItness": "体能", "PlayerForm": "近期表现", "PlayerTrainingOverview": "训练", "PlayerSeasonStats": "赛季数据", "CareerStats": "生涯数据"};const keys=['Large','Standard','Small','Large-FMC','Phone_Landscape'];function show(key){let a=data[key],cols=Math.max(...a.map(t=>t.x+t.width)),rows=Math.max(...a.map(t=>t.y+t.height));let grid=document.querySelector('#grid');grid.innerHTML='';grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;grid.style.gridTemplateRows=`repeat(${rows},minmax(34px,4vw))`;document.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.textContent===key));a.slice().sort((a,b)=>a.y-b.y||a.x-b.x).forEach(t=>{let e=document.createElement('div');e.className='tile';e.style.gridColumn=`${t.x+1} / span ${t.width}`;e.style.gridRow=`${t.y+1} / span ${t.height}`;e.innerHTML=`<div>${labels[t.id]||t.id}<small>${t.width} × ${t.height}</small></div>`;e.onclick=()=>document.querySelector('#detail').textContent=`${t.id}
位置 x=${t.x}, y=${t.y}
尺寸 width=${t.width}, height=${t.height}`;grid.append(e)});document.querySelector('#detail').textContent=key+'：'+cols+' 列 × '+rows+' 行（点击模块查看详情）'}keys.forEach(k=>{let b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k);document.querySelector('#tabs').append(b)});show('Large');</script>
