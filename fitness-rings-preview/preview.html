<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>体能、比赛状态、疲劳 · 排版预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#14171c;color:white;font-family:'Microsoft YaHei',sans-serif;padding:40px}main{width:630px;margin:auto}.panel{background:#22262d;padding:30px;border-radius:8px}.summary{display:flex;align-items:center;gap:28px;font-size:30px;font-weight:bold}.rep{font-size:17px;font-weight:normal;color:#a0a0a0;margin-left:auto}.bar{display:flex;align-items:center;gap:16px;margin:18px 0;color:#a0a0a0}.track{height:14px;flex:1;background:#41454b;border-radius:7px;overflow:hidden}.fill{width:78%;height:100%;background:#d4de53}.attrs{display:flex;justify-content:center;margin:24px 0}.attr{flex:1;text-align:center;font-size:16px;border-right:1px solid #44484e}.attr:last-child{border:0}.attr span{display:block;font-size:12px;margin-top:8px;color:#a0a0a0}.stick{height:28px;width:7px;background:#d4de53;margin:10px auto}.rings{display:flex;justify-content:space-around;margin-top:30px}.metric{text-align:center;width:33.333%}svg{width:100px;height:100px;display:block;margin:auto}.base,.arc{fill:none;stroke-width:7}.base{stroke:#41464e}.arc{stroke:#d4de53;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}.value{font-size:25px;margin-top:12px;font-weight:bold}.label{color:#a0a0a0;font-size:17px;margin-top:8px}.controls{margin-top:26px;color:#a0a0a0;font-size:14px}.controls label{display:flex;align-items:center;gap:16px;margin:12px 0}.controls input{flex:1;accent-color:#d4de53}.note{color:#a0a0a0;font-size:13px;line-height:1.8}</style>
<main><section class="panel"><div class="summary">↗ 156 <b>↘ 180</b><span class="rep">声望 8500</span></div><div class="bar">隐藏<div class="track"><div class="fill"></div></div></div><div class="attrs" id="row3"></div><div class="attrs" id="row4"></div><div class="rings" id="rings"></div></section><div class="controls" id="controls"></div><p class="note">排版图示 · 示例数值，非当前球员实时数据。拖动滑块查看圆环随数值变化。<br>圆环从顶部顺时针填充，疲劳数值越高，圆环越满。</p></main>
<script>
const rows=[['适应性','雄心','争论','忠诚','抗压','职业','体育道德'],['情绪控制','多面性','稳定','肮脏动作','大赛发挥','受伤倾向']];
rows.forEach((names,i)=>document.getElementById('row'+(i+3)).innerHTML=names.map((n,j)=>`<div class="attr">${[15,18,8,16,14,17,15][j]}<div class="stick"></div><span>${n}</span></div>`).join(''));
const metrics=[['体能',92],['比赛状态',78],['疲劳',24]];
metrics.forEach(([name,value],i)=>{document.getElementById('rings').insertAdjacentHTML('beforeend',`<div class="metric"><svg viewBox="0 0 100 100" aria-label="${name}"><circle class="base" cx="50" cy="50" r="42"/><circle id="arc${i}" class="arc" cx="50" cy="50" r="42" pathLength="100"/></svg><div class="value" id="value${i}"></div><div class="label">${name}</div></div>`);document.getElementById('controls').insertAdjacentHTML('beforeend',`<label>${name}<input aria-label="${name}" type="range" min="0" max="100" value="${value}" oninput="update(${i},this.value)"></label>`);update(i,value)});
function update(i,v){v=Math.min(100,Math.max(0,Number(v)||0));const arc=document.getElementById('arc'+i);arc.style.strokeDasharray=`${v} ${100-v}`;arc.style.visibility=v===0?'hidden':'visible';document.getElementById('value'+i).textContent=v+'%';}
</script></html>
